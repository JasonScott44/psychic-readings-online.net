<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#1a1a2e;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:2rem}
.code{font-size:8rem;font-weight:700;opacity:.3}
h1{font-size:1.5rem;margin:.5rem 0}
p{opacity:.6;margin-bottom:2rem}
a{color:#e94560;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div>
<div class="code">404</div>
<h1>Page Not Found</h1>
<p>The page you are looking for does not exist.</p>
<a href="/">Go Home</a>
</div>
</body>
</html>
